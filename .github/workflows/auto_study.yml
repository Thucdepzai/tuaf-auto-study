name: TUAF Weekly Auto Study

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tuaf-auto-study-group
  cancel-in-progress: false

jobs:
  auto-study:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TUAF_USERNAME: ${{ secrets.TUAF_USERNAME }}
      TUAF_PASSWORD: ${{ secrets.TUAF_PASSWORD }}
      ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
      ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TUAF Auto Study & Reply Zalo (5 hours continuous)
        run: python -X utf8 auto_study.py

      - name: Chain next 24/7 run seamlessly
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/actions/workflows/auto_study.yml/dispatches" \
            -d '{"ref":"main"}' || true
