name: TUAF Weekly Auto Study

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: tuaf-auto-study-group
  cancel-in-progress: false

jobs:
  auto-study:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TUAF_USERNAME: ${{ secrets.TUAF_USERNAME }}
      TUAF_PASSWORD: ${{ secrets.TUAF_PASSWORD }}
      ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
      ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TUAF Auto Study & Reply Zalo
        run: python -X utf8 auto_study.py
